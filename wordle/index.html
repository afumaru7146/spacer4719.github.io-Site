<style>
  body {
    background: linear-gradient(135deg, #0a3d62 0%, #003366 100%);
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    color: #e0f7fa;
    text-align: center;
    margin: 0;
    padding: 0;
  }
  h1 {
    font-size: 2.5rem;
    margin-top: 2.5rem;
    margin-bottom: 2rem;
    color: #00f7ff;
    text-shadow: 0 0 12px #00f7ff, 0 0 24px #0ff;
    letter-spacing: 0.08em;
    font-weight: bold;
    animation: flicker 2s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }
  .profile-table {
    margin: 0 auto 3rem auto;
    border-collapse: separate;
    border-spacing: 0;
    background: rgba(10, 61, 98, 0.85);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 32px #00f7ff33, 0 1.5px 0 #00f7ff55 inset;
    min-width: 340px;
    max-width: 600px;
    width: 90vw;
  }
  .profile-table th, .profile-table td {
    padding: 18px 16px;
    text-align: center;
    border-bottom: 1px solid #00f7ff55;
    font-size: 1.1rem;
    transition: background 0.2s;
  }
  .profile-table th {
    background: linear-gradient(90deg, #0000ff 60%, #003366 100%);
    color: #fff;
    font-weight: bold;
    font-size: 1.15rem;
    letter-spacing: 0.05em;
    border-right: 1px solid #00f7ff55;
    text-shadow: 0 0 8px #00f7ff, 0 0 2px #fff;
  }
  .profile-table td:first-child {
    background: linear-gradient(90deg, #0000ff 60%, #003366 100%);
    color: #fff;
    font-weight: bold;
    border-right: 1px solid #00f7ff55;
    text-shadow: 0 0 8px #00f7ff, 0 0 2px #fff;
    min-width: 120px;
  }
  .profile-table tr:last-child td, .profile-table tr:last-child th {
    border-bottom: none;
  }
  .profile-table td {
    background: rgba(30, 30, 40, 0.85);
    color: #e0f7fa;
    font-size: 1.08rem;
    word-break: break-word;
  }
  .profile-table img {
    width: 120px;
    height: 120px;
    border-radius: 16px;
    box-shadow: 0 0 16px #00f7ff88;
    background: #222;
    margin: 0.5em 0;
  }
  .profile-table span[style*="background-color"] {
    border-radius: 4px;
    border: 1.5px solid #00f7ff;
    box-shadow: 0 0 8px #00f7ff88;
    margin-left: 0.6em;
    vertical-align: middle;
    display: inline-block;
    width: 1.2em;
    height: 1.2em;
  }

  .profile-table tr:hover td {
    background: rgba(0, 247, 255, 0.08);
    transition: background 0.2s;
  }

  ::-webkit-scrollbar {
    width: 8px;
    background: #003366;
  }
  ::-webkit-scrollbar-thumb {
    background: #00f7ff88;
    border-radius: 4px;
  }

  .footer-bar {
    width: 100vw;
    margin: 0;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    background: linear-gradient(90deg, #003366 0%, #005577 100%);
    box-shadow: 0 -4px 24px #00f7ff55, 0 -1px 0 #00f7ff inset;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0;
  }
  .footer-bar span {
    color: #00f7ff;
    font-size: 1.1rem;
    text-shadow: 0 0 8px #00f7ff, 0 0 2px #fff;
    letter-spacing: 0.03em;
  }
  .footer-bar a {
    color: #00f7ff;
    text-decoration: underline;
    font-weight: bold;
  }
  .footer-space {
    height: 56px;
  }
  @media (max-width: 700px) {
    .profile-table {
      font-size: 0.98rem;
      min-width: unset;
      width: 99vw;
    }
    .profile-table th, .profile-table td {
      padding: 10px 6px;
      font-size: 0.98rem;
    }
    .profile-table img {
      width: 72px;
      height: 72px;
    }
    h1 {
      font-size: 1.5rem;
    }
  }
</style>
</head>
</html>

          <li><a href="https://spacer4719.f5.si/blog" style="color:#00f7ff; font-size:1.1rem; font-weight:bold; text-shadow:0 0 8px #000000, 0 0 2px #000000; padding:0.3em 1em; border-radius:8px; transition:background 0.2s, color 0.2s, box-shadow 0.2s; text-decoration:none; letter-spacing:0.05em;">ブログ</a></li>
          <li><a href="https://spacer4719.f5.si/newstart" style="color:#00f7ff; font-size:1.1rem; font-weight:bold; text-shadow:0 0 8px #000000, 0 0 2px #000000; padding:0.3em 1em; border-radius:8px; transition:background 0.2s, color 0.2s, box-shadow 0.2s; text-decoration:none; letter-spacing:0.05em;">ᴄʜᴀᴘᴛᴇʀ ɪɪɪ</a></li>
          <li><a href="https://spacer4719.f5.si/wordle" style="color:#00f7ff; font-size:1.1rem; font-weight:bold; text-shadow:0 0 8px #000000, 0 0 2px #000000; padding:0.3em 1em; border-radius:8px; transition:background 0.2s, color 0.2s, box-shadow 0.2s; text-decoration:none; letter-spacing:0.05em;">Wordle</a></li>

<html>
<head>
      <meta property="og:url" content="https://spacer4719.f5.si/"/>
  <meta property="og:type" content="website"/>
    <title>spacer4719's site</title>
</head>
<head>
<body bgcolor="#10100E" text="#cccccc">
    </div>
    <title>spacer4719のサイト</title>
    <meta name="Description" content="こんにちは。">
    <style>
        p{ font-size: 18px; }
    </style>
</head>

<body>

<header class="header">

    <button class="icon-button" id="helpButton">?</button>

    <h1>WORDLE</h1>

    <div class="header-right">
        <button class="icon-button" id="statsButton">📊</button>
        <button class="icon-button" id="settingsButton">⚙</button>
    </div>

</header>


<main>

    <div id="message"></div>

    <section id="board" aria-label="Game board"></section>

    <section id="keyboard">

        <div class="keyboard-row">
            <button class="key" data-key="Q">Q</button>
            <button class="key" data-key="W">W</button>
            <button class="key" data-key="E">E</button>
            <button class="key" data-key="R">R</button>
            <button class="key" data-key="T">T</button>
            <button class="key" data-key="Y">Y</button>
            <button class="key" data-key="U">U</button>
            <button class="key" data-key="I">I</button>
            <button class="key" data-key="O">O</button>
            <button class="key" data-key="P">P</button>
        </div>

        <div class="keyboard-row">
            <button class="key" data-key="A">A</button>
            <button class="key" data-key="S">S</button>
            <button class="key" data-key="D">D</button>
            <button class="key" data-key="F">F</button>
            <button class="key" data-key="G">G</button>
            <button class="key" data-key="H">H</button>
            <button class="key" data-key="J">J</button>
            <button class="key" data-key="K">K</button>
            <button class="key" data-key="L">L</button>
        </div>

        <div class="keyboard-row">
            <button class="key wide" data-key="ENTER">ENTER</button>

            <button class="key" data-key="Z">Z</button>
            <button class="key" data-key="X">X</button>
            <button class="key" data-key="C">C</button>
            <button class="key" data-key="V">V</button>
            <button class="key" data-key="B">B</button>
            <button class="key" data-key="N">N</button>
            <button class="key" data-key="M">M</button>

            <button class="key wide" data-key="BACKSPACE">⌫</button>
        </div>

    </section>

</main>


<!-- Help -->

<div class="modal" id="helpModal">

    <div class="modal-content">

        <button class="close" data-close="helpModal">×</button>

        <h2>遊び方</h2>

        <p>
            6回以内に5文字の英単語を当ててください。
        </p>

        <div class="example">
            <span class="example-tile correct">W</span>
            <span class="example-tile">E</span>
            <span class="example-tile">A</span>
            <span class="example-tile">R</span>
            <span class="example-tile">Y</span>
        </div>

        <p>
            🟩 文字も位置も正解
        </p>

        <p>
            🟨 文字は含まれるが位置が違う
        </p>

        <p>
            ⬛ 答えに含まれない
        </p>

    </div>

</div>


<!-- Statistics -->

<div class="modal" id="statsModal">

    <div class="modal-content stats-modal">

        <button class="close" data-close="statsModal">
            ×
        </button>

        <h2>統計</h2>

        <div class="stats">

            <div>
                <strong id="played">0</strong>
                <span>プレイ</span>
            </div>

            <div>
                <strong id="winRate">0</strong>
                <span>勝率</span>
            </div>

            <div>
                <strong id="currentStreak">0</strong>
                <span>連勝</span>
            </div>

            <div>
                <strong id="maxStreak">0</strong>
                <span>最大連勝</span>
            </div>

        </div>


        <h3>推測回数</h3>

        <div id="guessDistribution">

            <div class="distribution-row">
                <span>1</span>
                <div class="bar">
                    <span data-count="1"></span>
                </div>
                <strong>0</strong>
            </div>

            <div class="distribution-row">
                <span>2</span>
                <div class="bar">
                    <span data-count="2"></span>
                </div>
                <strong>0</strong>
            </div>

            <div class="distribution-row">
                <span>3</span>
                <div class="bar">
                    <span data-count="3"></span>
                </div>
                <strong>0</strong>
            </div>

            <div class="distribution-row">
                <span>4</span>
                <div class="bar">
                    <span data-count="4"></span>
                </div>
                <strong>0</strong>
            </div>

            <div class="distribution-row">
                <span>5</span>
                <div class="bar">
                    <span data-count="5"></span>
                </div>
                <strong>0</strong>
            </div>

            <div class="distribution-row">
                <span>6</span>
                <div class="bar">
                    <span data-count="6"></span>
                </div>
                <strong>0</strong>
            </div>

        </div>


        <button
            id="shareButton"
            class="share-button"
        >
            結果を共有
        </button>

    </div>

</div>

<script src="words.js"></script>
<script src="game.js"></script>

</body>
</html>
