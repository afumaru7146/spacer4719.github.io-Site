<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wordle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <button class="icon-button" id="helpButton">?</button>

    <h1>WORDLE</h1>

    <div class="header-right">
        <button class="icon-button" id="statsButton">📊</button>
        <button class="icon-button" id="settingsButton">⚙</button>
    </div>

</header>


<main>

    <div id="message"></div>

    <section id="board" aria-label="Game board"></section>

    <section id="keyboard">

        <div class="keyboard-row">
            <button class="key" data-key="Q">Q</button>
            <button class="key" data-key="W">W</button>
            <button class="key" data-key="E">E</button>
            <button class="key" data-key="R">R</button>
            <button class="key" data-key="T">T</button>
            <button class="key" data-key="Y">Y</button>
            <button class="key" data-key="U">U</button>
            <button class="key" data-key="I">I</button>
            <button class="key" data-key="O">O</button>
            <button class="key" data-key="P">P</button>
        </div>

        <div class="keyboard-row">
            <button class="key" data-key="A">A</button>
            <button class="key" data-key="S">S</button>
            <button class="key" data-key="D">D</button>
            <button class="key" data-key="F">F</button>
            <button class="key" data-key="G">G</button>
            <button class="key" data-key="H">H</button>
            <button class="key" data-key="J">J</button>
            <button class="key" data-key="K">K</button>
            <button class="key" data-key="L">L</button>
        </div>

        <div class="keyboard-row">
            <button class="key wide" data-key="ENTER">ENTER</button>

            <button class="key" data-key="Z">Z</button>
            <button class="key" data-key="X">X</button>
            <button class="key" data-key="C">C</button>
            <button class="key" data-key="V">V</button>
            <button class="key" data-key="B">B</button>
            <button class="key" data-key="N">N</button>
            <button class="key" data-key="M">M</button>

            <button class="key wide" data-key="BACKSPACE">⌫</button>
        </div>

    </section>

</main>


<!-- Help -->

<div class="modal" id="helpModal">

    <div class="modal-content">

        <button class="close" data-close="helpModal">×</button>

        <h2>遊び方</h2>

        <p>
            6回以内に5文字の英単語を当ててください。
        </p>

        <div class="example">
            <span class="example-tile correct">W</span>
            <span class="example-tile">E</span>
            <span class="example-tile">A</span>
            <span class="example-tile">R</span>
            <span class="example-tile">Y</span>
        </div>

        <p>
            🟩 文字も位置も正解
        </p>

        <p>
            🟨 文字は含まれるが位置が違う
        </p>

        <p>
            ⬛ 答えに含まれない
        </p>

    </div>

</div>


<!-- Statistics -->

<div class="modal" id="statsModal">

    <div class="modal-content">

        <button class="close" data-close="statsModal">×</button>

        <h2>統計</h2>

        <div class="stats">

            <div>
                <strong id="played">0</strong>
                <span>プレイ</span>
            </div>

            <div>
                <strong id="winRate">0</strong>
                <span>勝率</span>
            </div>

            <div>
                <strong id="streak">0</strong>
                <span>連勝</span>
            </div>

            <div>
                <strong id="maxStreak">0</strong>
                <span>最大連勝</span>
            </div>

        </div>

        <button id="shareButton" class="share-button">
            結果を共有
        </button>

    </div>

</div>


<!-- Settings -->

<div class="modal" id="settingsModal">

    <div class="modal-content">

        <button class="close" data-close="settingsModal">×</button>

        <h2>設定</h2>

        <label class="setting">

            <span>ダークモード</span>

            <input
                type="checkbox"
                id="darkMode"
            >

        </label>

    </div>

</div>


<script src="game.js"></script>

</body>
</html>
